<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7B54" />
      <stop offset="50%" stop-color="#FF6038" />
      <stop offset="100%" stop-color="#E04620" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#E04620" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#orangeGrad)"/>
  
  <!-- Cash Register / Book Motif -->
  <g filter="url(#shadow)" transform="translate(106, 96)">
    <!-- Stand / Base -->
    <rect x="20" y="240" width="260" height="48" rx="12" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect x="40" y="258" width="80" height="12" rx="6" fill="#FF6038"/>
    
    <!-- Screen / Register Body -->
    <rect x="35" y="50" width="230" height="175" rx="20" fill="#FFFFFF"/>
    
    <!-- Screen Glass -->
    <rect x="55" y="70" width="190" height="95" rx="12" fill="#1E293B"/>
    <text x="75" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#10B981">Rp 75.000</text>
    <text x="75" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">3 item · LUNAS ✓</text>
    
    <!-- Keypad -->
    <rect x="55" y="180" width="40" height="24" rx="6" fill="#F1F5F9"/>
    <rect x="105" y="180" width="40" height="24" rx="6" fill="#F1F5F9"/>
    <rect x="155" y="180" width="40" height="24" rx="6" fill="#F1F5F9"/>
    <rect x="205" y="180" width="40" height="24" rx="6" fill="#FF6038"/>

    <!-- Receipt coming out -->
    <path d="M 125 50 L 125 15 L 140 22 L 155 15 L 170 22 L 175 15 L 175 50 Z" fill="#F8FAFC"/>
  </g>
</svg>
