<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Kasir Ayam Bebek S.K.B - Aplikasi Kasir & Laporan Cabang</title>
    <meta name="description" content="Aplikasi kasir & dashboard pemilik Rumah Makan Ayam Bebek S.K.B (2 cabang): transaksi offline-first, laba/rugi real-time, dan ekspor CSV." />
    <meta property="og:title" content="Kasir Ayam Bebek S.K.B - Aplikasi Kasir & Laporan Cabang" />
    <meta property="og:description" content="Aplikasi kasir & dashboard pemilik Rumah Makan Ayam Bebek S.K.B (2 cabang): transaksi offline-first, laba/rugi real-time, dan ekspor CSV." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Font: DM Sans (design token --tema-font) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link id="fontTema" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- PWA Settings -->
    <meta name="theme-color" content="#173f2b" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="S.K.B" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Mode gelap: terapkan sebelum paint pertama (anti-flash).
         Pilihan tersimpan di localStorage 'tema-mode'; kalau belum pernah
         dipilih, default terang. -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('tema-mode');
          var gelap = s === 'gelap';
          if (gelap) document.documentElement.setAttribute('data-mode', 'gelap');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
